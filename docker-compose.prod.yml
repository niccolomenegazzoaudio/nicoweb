# Stack di PRODUZIONE su arm_php — file STANDALONE.
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caratteristiche:
# - Bind diretto su :80 e :443 (HTTPS automatico via Let's Encrypt)
# - SOLO i dati editabili dall'admin sono persistiti come volumi:
#       user/pages     (contenuti)
#       user/config    (impostazioni)
#       user/data      (sottomissioni form, popolarità, ecc.)
#       user/accounts  (utenti admin)
#       backup, logs, cache, tmp
#   Il resto (codice, tema, plugin, vendor) viene dall'immagine: ogni deploy
#   aggiorna automaticamente CSS/template/Dockerfile senza che servano interventi
#   manuali sul live.
# - Caddy (cert ACME, config) persistito per non rifare il challenge ad ogni rebuild.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: nicoweb:prod
    container_name: nicoweb
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Caddy genera/rinnova certificati per questi host. Aggiungi/rimuovi
      # qui i domini quando cambia il DNS.
      - SERVER_NAME=niccolomenegazzo.com www.niccolomenegazzo.com
      - ACME_EMAIL=niccolomenegazzoaudio@gmail.com
    volumes:
      # TLS + ACME
      - caddy_data:/data
      - caddy_config:/config
      # Editabile dall'admin — sopravvive ai rebuild dell'immagine
      - nico_pages:/app/user/pages
      - nico_config:/app/user/config
      - nico_data:/app/user/data
      - nico_accounts:/app/user/accounts
      # Runtime
      - nico_cache:/app/cache
      - nico_logs:/app/logs
      - nico_tmp:/app/tmp
      - nico_backup:/app/backup

volumes:
  caddy_data:
  caddy_config:
  nico_pages:
  nico_config:
  nico_data:
  nico_accounts:
  nico_cache:
  nico_logs:
  nico_tmp:
  nico_backup:
